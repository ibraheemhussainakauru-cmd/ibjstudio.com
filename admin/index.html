<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>IBJSTUDIO Admin</title>
<style>
:root{--bg:#0a0a0a;--panel:#151515;--ink:#f2f0eb;--mute:#a5a199;--gold:#d8bd8a;--line:#262626;--onGold:#17130b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 .95rem/1.5 Outfit,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:var(--ink)}
.btn{display:inline-block;padding:.65rem 1.1rem;background:var(--gold);color:var(--onGold);border:1px solid var(--gold);font-weight:500;cursor:pointer;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border-color:#8a7550}.btn:disabled{opacity:.5}
.f{display:block;width:100%;background:var(--bg);border:1px solid var(--line);padding:.7rem .8rem;margin:0 0 .6rem}.f:focus{outline:2px solid var(--gold)}
#login{max-width:360px;margin:18vh auto;padding:1.4rem;background:var(--panel);border:1px solid var(--line)}
#login h1{font-size:1.3rem;margin:0 0 1rem}.err{color:#f0a0a0;min-height:1.3rem;font-size:.85rem}
header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-weight:600;letter-spacing:.12em}header b span{color:var(--gold)}.sp{flex:1}
.pill{font-size:.72rem;padding:.15rem .55rem;border:1px solid var(--line);border-radius:999px;color:var(--mute);white-space:nowrap}
.pill.g{color:#5fcf80;border-color:#2c5a3c}.pill.new{color:var(--onGold);background:var(--gold);border-color:var(--gold)}.pill.need{color:#f0c070;border-color:#7a5a20}
.tabs{display:flex;gap:.4rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}.tabs button{background:none;border:1px solid var(--line);padding:.5rem .9rem;cursor:pointer;min-height:40px}.tabs button.on{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem 1rem}.filters button{flex:none;background:none;border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.82rem}.filters button.on{border-color:var(--gold);color:var(--gold)}
.wrap{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 150px)}
.list{border-right:1px solid var(--line);overflow:auto}
.row{padding:.8rem 1rem;border-bottom:1px solid var(--line);cursor:pointer}.row:hover,.row.on{background:var(--panel)}
.row .t{display:flex;gap:.5rem;align-items:center}.row .t b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.unread .t b{color:var(--gold)}
.row p{margin:.2rem 0 0;color:var(--mute);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mute)}
.thread{display:flex;flex-direction:column;min-height:60vh}.tt{padding:.8rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.tt .nm{flex:1;min-width:160px}.tt small{display:block;color:var(--mute)}
.msgs{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem;max-height:62vh}
.m{max-width:80%;padding:.55rem .8rem;white-space:pre-wrap;overflow-wrap:anywhere}.m small{display:block;opacity:.65;font-size:.7rem;margin-top:.2rem}
.m.customer{align-self:flex-start;background:#222;border:1px solid var(--line)}.m.admin{align-self:flex-end;background:var(--gold);color:var(--onGold)}
.reply{border-top:1px solid var(--line);padding:.7rem 1rem;display:flex;gap:.6rem}.reply textarea{flex:1;height:3.4rem;resize:none;margin:0}
.empty{padding:2rem;color:var(--mute);text-align:center}
.orders{padding:1rem;display:grid;gap:.7rem;max-width:900px}.ord{background:var(--panel);border:1px solid var(--line);padding:.9rem 1rem}.ord .h{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.ord .h b{flex:1;font-weight:500}.ord p{margin:.3rem 0 0;color:var(--mute);font-size:.85rem;overflow-wrap:anywhere}
.back{display:none}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.thread{display:none}.wrap.open .list{display:none}.wrap.open .thread{display:flex}.back{display:inline-block}}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>IBJSTUDIO Admin</h1>
  <input class="f" id="pw" type="password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password">
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn" id="lbtn" type="button" style="width:100%">Sign in</button>
</div>
<div id="app" hidden>
  <header><b>IBJ<span>STUDIO</span></b><span class="pill g" id="live">Customers see you online</span><span class="sp"></span><button class="btn ghost" id="out" type="button">Sign out</button></header>
  <div class="tabs"><button id="tc" class="on" type="button">Conversations <span class="pill need" id="needs" hidden></span></button><button id="to" type="button">Paid orders</button></div>
  <div id="pc">
    <div class="filters" id="filters"></div>
    <div class="wrap" id="wrap">
      <div class="list" id="list"></div>
      <div class="thread" id="thread"><div class="empty">Select a conversation</div></div>
    </div>
  </div>
  <div id="po" hidden><div class="filters" id="ofilters"></div><div class="orders" id="orders"></div></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function el(t,a,k){var n=document.createElement(t);if(a)Object.keys(a).forEach(function(x){if(x==='text')n.textContent=a[x];else if(x==='class')n.className=a[x];else if(x.slice(0,2)==='on')n.addEventListener(x.slice(2),a[x]);else n.setAttribute(x,a[x])});(k||[]).forEach(function(c){if(c)n.appendChild(typeof c==='string'?document.createTextNode(c):c)});return n}
function api(m,p,b){return fetch('/api/admin/'+p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin'}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){j._s=r.status;return j})})}
var STAT={new:'New',open:'Open',waiting:'Waiting for customer',closed:'Closed'};
var filter='',cur=null,lt=null,ot=null,ofil='',curMsgCount=-1;
function when(s){var d=new Date(s*1000),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function show(app){$('login').hidden=app;$('app').hidden=!app;if(app){loadList();clearInterval(lt);lt=setInterval(function(){if(!document.hidden){loadList();if(cur)loadThread(true)}},5000)}else{clearInterval(lt)}}
function login(){$('lerr').textContent='';api('POST','login',{password:$('pw').value}).then(function(r){if(r.ok){$('pw').value='';show(true)}else $('lerr').textContent=r.error||'Could not sign in.'})}
$('lbtn').onclick=login;$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
$('out').onclick=function(){api('POST','logout',{}).then(function(){cur=null;show(false)})};
function buildFilters(){var f=$('filters');f.textContent='';[['','All'],['new','New'],['open','Open'],['waiting','Waiting for customer'],['closed','Closed']].forEach(function(x){f.appendChild(el('button',{type:'button',class:filter===x[0]?'on':'',text:x[1],onclick:function(){filter=x[0];buildFilters();loadList()}}))})}
function loadList(){api('GET','conversations'+(filter?'?status='+filter:'')).then(function(r){
  if(r._s===401){show(false);return}
  var n=$('needs');n.hidden=!r.needsReply;n.textContent=r.needsReply?r.needsReply+' waiting for you':'';
  var l=$('list');l.textContent='';
  if(!r.conversations.length){l.appendChild(el('div',{class:'empty',text:'No conversations yet'}));return}
  r.conversations.forEach(function(c){
    var need=c.lastSender==='customer'&&c.status!=='closed';
    l.appendChild(el('div',{class:'row'+(c.unread?' unread':'')+(cur===c.id?' on':''),onclick:function(){open(c.id)}},[
      el('div',{class:'t'},[el('b',{text:c.name}),need?el('span',{class:'pill need',text:'Needs reply'}):null,el('span',{class:'pill'+(c.status==='new'?' new':''),text:STAT[c.status]})]),
      el('p',{text:c.preview||''}),el('small',{text:c.email+' \u00B7 '+when(c.lastAt)})]))})})}
function open(id){cur=id;curMsgCount=-1;$('wrap').classList.add('open');loadThread(false);loadList()}
function loadThread(quiet){if(!cur)return;api('GET','conversation?id='+encodeURIComponent(cur)).then(function(r){
  if(r._s===401){show(false);return}if(!r.conversation)return;
  var c=r.conversation,t=$('thread');
  if(quiet&&r.messages.length===curMsgCount)return;curMsgCount=r.messages.length;
  var keep=t.querySelector('textarea');var draft=keep?keep.value:'';
  t.textContent='';
  var sel=el('select',{class:'f','aria-label':'Status',style:'width:auto;margin:0',onchange:function(){api('POST','update',{id:c.id,status:sel.value}).then(function(){loadThread(false);loadList()})}});
  Object.keys(STAT).forEach(function(k){var o=el('option',{value:k,text:STAT[k]});if(k===c.status)o.selected=true;sel.appendChild(o)});
  t.appendChild(el('div',{class:'tt'},[el('button',{class:'btn ghost back',type:'button',text:'\u2190',onclick:function(){cur=null;$('wrap').classList.remove('open');loadList()}}),
    el('div',{class:'nm'},[el('b',{text:c.name}),el('small',{text:c.email})]),sel,
    el('button',{class:'btn ghost',type:'button',text:'Mark unread',onclick:function(){api('POST','update',{id:c.id,unread:true}).then(function(){cur=null;$('wrap').classList.remove('open');$('thread').textContent='';loadList()})}}),
    el('button',{class:'btn ghost',type:'button',text:c.status==='closed'?'Reopen':'Close',onclick:function(){api('POST','update',{id:c.id,status:c.status==='closed'?'open':'closed'}).then(function(){loadThread(false);loadList()})}})]));
  var box=el('div',{class:'msgs'});r.messages.forEach(function(m){box.appendChild(el('div',{class:'m '+m.sender},[document.createTextNode(m.body),el('small',{text:when(m.at)})]))});
  t.appendChild(box);box.scrollTop=box.scrollHeight;
  var ta=el('textarea',{class:'f',placeholder:'Write a reply\u2026',maxlength:'4000','aria-label':'Reply'});ta.value=draft;
  var send=el('button',{class:'btn',type:'button',text:'Send',onclick:function(){var v=ta.value.trim();if(!v)return;send.disabled=true;api('POST','reply',{id:c.id,body:v}).then(function(){ta.value='';send.disabled=false;loadThread(false);loadList()})}});
  t.appendChild(el('div',{class:'reply'},[ta,send]))})}
function loadOrders(){api('GET','orders').then(function(r){if(r._s===401){show(false);return}
  var f=$('ofilters');f.textContent='';[['','All'],['paid','Paid'],['pending','Pending'],['failed','Failed'],['mismatch','Needs review']].forEach(function(x){f.appendChild(el('button',{type:'button',class:ofil===x[0]?'on':'',text:x[1],onclick:function(){ofil=x[0];loadOrders()}}))});
  var o=$('orders');o.textContent='';var rows=r.orders.filter(function(x){return !ofil||x.status===ofil});
  if(!rows.length){o.appendChild(el('div',{class:'empty',text:'No orders here yet'}));return}
  rows.forEach(function(x){o.appendChild(el('div',{class:'ord'},[el('div',{class:'h'},[el('b',{text:x.name+' \u00B7 \u20A6'+(x.ngnKobo/100).toLocaleString('en-US')}),el('span',{class:'pill'+(x.status==='paid'?' g':x.status==='mismatch'?' need':''),text:x.status==='mismatch'?'needs review':x.status})]),
    el('p',{text:x.email+' \u00B7 USD $'+(x.usdCents/100).toFixed(2)+' \u00B7 viewed in '+(x.currency||'USD')}),el('p',{text:'Items: '+x.items.join(', ')}),el('p',{text:'Ref: '+x.reference+' \u00B7 ordered '+when(x.createdAt)+(x.paidAt?' \u00B7 paid '+when(x.paidAt):'')+(x.notes?' \u00B7 '+x.notes:'')})]))})})}
$('tc').onclick=function(){$('tc').className='on';$('to').className='';$('pc').hidden=false;$('po').hidden=true;clearInterval(ot)};
$('to').onclick=function(){$('to').className='on';$('tc').className='';$('pc').hidden=true;$('po').hidden=false;loadOrders();clearInterval(ot);ot=setInterval(function(){if(!document.hidden)loadOrders()},15000)};
buildFilters();
api('GET','me').then(function(r){show(!!r.ok)});
})();
</script>
</body>
</html>
